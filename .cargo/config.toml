# Native Whisper/GGML must run on the target architecture's baseline, not
# inherit optional instructions from the packaging machine. Metal/Vulkan
# backend selection remains controlled by the existing Cargo features.
[env]
GGML_NATIVE = { value = "OFF", force = true }
GGML_CPU_ARM_ARCH = { value = "armv8-a", force = true }
GGML_SSE42 = { value = "OFF", force = true }
GGML_AVX = { value = "OFF", force = true }
GGML_AVX2 = { value = "OFF", force = true }
GGML_AVX_VNNI = { value = "OFF", force = true }
GGML_AVX512 = { value = "OFF", force = true }
GGML_AVX512_VBMI = { value = "OFF", force = true }
GGML_AVX512_VNNI = { value = "OFF", force = true }
GGML_AVX512_BF16 = { value = "OFF", force = true }
GGML_BMI2 = { value = "OFF", force = true }
GGML_FMA = { value = "OFF", force = true }
GGML_F16C = { value = "OFF", force = true }
GGML_AMX_TILE = { value = "OFF", force = true }
GGML_AMX_INT8 = { value = "OFF", force = true }
GGML_AMX_BF16 = { value = "OFF", force = true }

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=generic"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=generic"]
