[package]
name = "onecopy"
version = "0.1.0"
description = "An inbox-zero dedup handler for photos, videos, and other files"
authors = ["Yoshinao Inoguchi <yoshinao@inoguchi.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/nao7sep/onecopy"
edition = "2021"
default-run = "onecopy"
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Warnings are errors, on EVERY platform the app ships to — the gate this table exists for.
# It lives in the manifest rather than in CI or a RUSTFLAGS export so that one declaration
# covers `cargo check`, `cargo test`, `cargo build`, the local `npm run check`, and CI alike;
# a gate only CI enforces is one every developer meets late, and a `cfg(windows)` warning is
# invisible to a macOS-only gate because that code is never compiled there.
[lints.rust]
warnings = "deny"
# The one exception, and it must be explicit or the gate fails every Windows build forever:
# the MSVC linker prints an informational note (localized — in Japanese on a ja_JP machine)
# saying it created an import library. That is the toolchain narrating, not a defect in this
# code, and nothing here can silence it at the source.
linker_messages = "allow"

[lib]
# OneCopy ships as a macOS/Windows desktop application. The mobile-oriented
# Tauri template also emitted staticlib and cdylib artifacts for every local
# build even though no shipped target consumed them; the desktop binary and
# Rust integration tests need only the rlib.
name = "onecopy_lib"
crate-type = ["rlib"]

[[test]]
name = "ai_test_suite"
path = "tests/suites/ai.rs"

[[test]]
name = "library_test_suite"
path = "tests/suites/library.rs"

# Scenarios that deliberately set the process-wide scanner cancellation flag
# cannot share a process with ordinary parallel readers of that flag.
[[test]]
name = "scan_lifecycle_test_suite"
path = "tests/suites/scan_lifecycle.rs"

[[test]]
name = "media_test_suite"
path = "tests/suites/media.rs"

[[test]]
name = "operations_test_suite"
path = "tests/suites/operations.rs"

[[test]]
name = "platform_test_suite"
path = "tests/suites/platform.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
# Native message box for the narrower failure where Tauri cannot construct its
# runtime and no application-owned webview exists. rfd is what the dialog
# plugin uses underneath; Windows common controls preserve the labelled Quit.
rfd = { version = "0.17", features = ["common-controls-v6"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# System IANA timezone name, used once to seed config.json's defaultTimezone on
# first run (the wizard then owns the value).
iana-time-zone = "0.1"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
# The index database and the write-through data-backup store. `bundled` compiles
# SQLite from source into the binary, so no system libsqlite3 is needed and
# packaging stays churn-free (the lowest-friction SQLite binding for the Rust
# core, per the data-backup conventions' "built-in or lowest-friction binding"
# rule).
rusqlite = { version = "0.40", features = ["bundled", "collation"] }
kamadak-exif = "0.6.1"
nom-exif = "3.6.2"
blake3 = "1.8.6"
walkdir = "2.5.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
image = { version = "0.25.10", default-features = false, features = [
    "bmp", "gif", "jpeg", "png", "tiff", "webp",
] }
# OneCopy uses libwebp's raw RGBA encoder rather than webp's DynamicImage
# adapters, so its optional image-crate feature would only widen the graph.
webp = { version = "0.3.1", default-features = false }
keepawake = "0.6.0"
# Streaming managed-artifact downloads need separate per-read idleness and a
# size-scaled whole-operation deadline; the previous ureq path exposed only a
# whole-body timeout.
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
tokio = { version = "1.53.1", features = ["rt", "time", "net", "macros", "fs", "io-util"] }
zip = "8.6.0"
notify = "8.2.0"
# The production large-v3-turbo fixture is 3.9x faster in a release build on
# Apple Silicon through whisper.cpp's Metal backend. Other platforms keep the
# portable CPU backend until their own packaged measurements justify a native
# accelerator.
whisper-rs = "0.16.0"
ndarray = "0.17.2"
encoding_rs = "0.8.35"
chardetng = "1.0.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
# Load the packaged runtime only when face scoring actually starts. This keeps
# optional model code out of process initialization on older Windows CPUs.
ort = { version = "2.0.0-rc.13", features = ["load-dynamic"] }

[target.'cfg(not(windows))'.dependencies]
ort = "2.0.0-rc.13"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW binds destructive reads to regular-file descriptors; on macOS,
# renamex_np is also the atomic no-clobber publication primitive.
libc = "0.2"

# Keep development symbols useful without Rust's macOS default of leaving one
# unpacked codegen object per unit in target/debug/deps. That default grew this
# repository's cache to hundreds of thousands of files and made Cargo spend
# tens of seconds merely enumerating the directory.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

# Media derivation was measured at roughly 18x slower with an entirely
# unoptimized dependency graph. Optimize only the dependencies that execute
# CPU-heavy media, hashing, inference, compression, or SQLite work; compiling
# the Tauri/WebKit plumbing at opt-level 2 buys no application throughput and
# makes clean development builds much more expensive.
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.webp]
opt-level = 2
[profile.dev.package.libwebp-sys]
opt-level = 2
[profile.dev.package.blake3]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.whisper-rs]
opt-level = 2
[profile.dev.package.whisper-rs-sys]
opt-level = 2
[profile.dev.package.ort]
opt-level = 2
[profile.dev.package.ort-sys]
opt-level = 2
[profile.dev.package.rusqlite]
opt-level = 2
[profile.dev.package.libsqlite3-sys]
opt-level = 2
[profile.dev.package.zstd]
opt-level = 2
[profile.dev.package.zstd-sys]
opt-level = 2

[dev-dependencies]
# Serializes the tests that share the process-global backup-store singleton
# (`static STORE` in backup_store.rs); unrelated tests still parallelize.
serial_test = { version = "4", default-features = false }
tempfile = "3.24"
